# Auto-provisioned Grafana datasource pointing at the InfluxDB that k6 writes to
# when run with -e K6_OUT=influxdb=http://influxdb:8086/k6 (see docker-compose).
apiVersion: 1
datasources:
  - name: k6 (InfluxDB)
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    database: k6
    isDefault: true
