# Local load-testing stack for Task Tracker — runs on the load-generator machine
# only (this whole folder is gitignored). Targets the VM's edge over the LAN.
#
#   cp .env.example .env        # set BASE_URL=http://<VM_IP>, LOAD_PASSWORD=...
#   docker compose run --rm k6 run /scripts/smoke.js
#
# The k6 container reaches the VM by LAN IP over the default bridge network, so
# no host networking is needed (works on Docker Desktop for Windows).
#
# Optional live dashboard (InfluxDB + Grafana):
#   docker compose --profile dashboard up -d
#   docker compose run --rm -e K6_OUT=influxdb=http://influxdb:8086/k6 \
#     k6 run /scripts/load-http.js
#   # Grafana at http://localhost:3001 — import the k6 dashboard (ID 2587).

services:
  k6:
    image: grafana/k6:latest
    env_file: [.env]
    environment:
      # Docker Desktop (Windows) propagates the host's system proxy into
      # containers. That proxy is browser-only and breaks k6's direct LAN
      # access, so neutralize it here — k6 always goes straight to the target.
      # (Overrides anything Docker Desktop injects; no need to toggle the
      # Windows proxy off before each run.)
      HTTP_PROXY: ""
      HTTPS_PROXY: ""
      http_proxy: ""
      https_proxy: ""
      NO_PROXY: "*"
      no_proxy: "*"
    # `docker compose run --rm k6 run /scripts/<name>.js` appends the command.
    volumes:
      - ./scripts:/scripts:ro
      - ./results:/results

  influxdb:
    image: influxdb:1.8
    profiles: [dashboard]
    environment:
      INFLUXDB_DB: k6
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports: ["8086:8086"]
    volumes:
      - influx_data:/var/lib/influxdb

  grafana:
    image: grafana/grafana:latest
    profiles: [dashboard]
    depends_on: [influxdb]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    ports: ["3001:3000"]
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/influx.yml:ro

volumes:
  influx_data:
